<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DYNAX Block Explorer - Latest Blocks</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; padding: 30px 20px; margin-bottom: 30px; }
        header h1 { font-size: 2em; color: #d4af37; margin-bottom: 20px; }
        .search-box { max-width: 600px; margin: 20px auto; display: flex; gap: 10px; }
        .search-box input { flex: 1; padding: 12px; border: 2px solid #333; border-radius: 10px; background: #1a1a1a; color: #fff; font-size: 1em; }
        .search-box input:focus { outline: none; border-color: #d4af37; }
        .btn { padding: 12px 25px; border: none; border-radius: 10px; font-size: 1em; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: #d4af37; color: #000; font-weight: bold; }
        .btn-primary:hover { background: #c4a030; }
        .btn-secondary { background: #333; color: #fff; }
        .btn-secondary:hover { background: #444; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .blocks-list { display: flex; flex-direction: column; gap: 20px; margin-bottom: 30px; }
        .block-card { background: #1a1a1a; border-radius: 15px; padding: 20px; border: 2px solid #333; transition: all 0.3s; }
        .block-card:hover { border-color: #d4af37; }
        .block-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .block-number { font-size: 1.5em; font-weight: bold; color: #d4af37; }
        .block-timestamp { color: #888; font-size: 0.9em; }
        .block-hash { font-family: 'Courier New', monospace; color: #aaa; word-break: break-all; margin-bottom: 15px; font-size: 0.9em; }
        .block-info { display: flex; gap: 20px; flex-wrap: wrap; }
        .info-item { display: flex; align-items: center; gap: 8px; }
        .info-label { color: #888; }
        .info-value { font-weight: bold; color: #fff; }
        .tx-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8em; margin-left: 5px; }
        .tx-badge.user { background: #4CAF50; color: white; }
        .tx-badge.coinbase { background: #2196F3; color: white; }
        .pagination { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 30px; flex-wrap: wrap; }
        .page-info { color: #888; font-size: 1em; }
        .loading { text-align: center; padding: 40px; color: #888; }
        .nav-links { text-align: center; margin-bottom: 20px; }
        .nav-links a { color: #d4af37; text-decoration: none; margin: 0 10px; padding: 10px 20px; background: #1a1a1a; border-radius: 10px; border: 1px solid #333; }
        .nav-links a:hover { background: #2a2a2a; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Latest Blocks</h1>
            <div class="nav-links">
                <a href="/explorer.html">📊 Dashboard</a>
                <a href="/blocks.html">📦 Blocks</a>
                <a href="/wallet.html">💰 Wallet</a>
            </div>
            <div class="search-box">
                <input type="number" id="search-block" placeholder="ค้นหาบล็อกตามหมายเลข (เช่น 1, 100, 10234)">
                <button class="btn btn-primary" onclick="searchBlock()">ค้นหา</button>
            </div>
            <button class="btn btn-secondary" onclick="loadBlocks(1)">← กลับสู่บล็อกใหม่สุด</button>
        </header>
        <div id="blocks-container"><div class="loading">กำลังโหลดบล็อก...</div></div>
        <div id="pagination" class="pagination"></div>
    </div>
    <script>
        const API_BASE = window.location.origin + '/api/v1';
        let currentPage = 1;
        let totalPages = 1;
        async function loadBlocks(page = 1) {
            try {
                currentPage = page;
                const response = await fetch(API_BASE + '/blocks?page=' + page + '&limit=20');
                const data = await response.json();
                if (Array.isArray(data)) { displayBlocks(data); document.getElementById('pagination').innerHTML = ''; return; }
                const blocks = data.blocks;
                const pagination = data.pagination;
                totalPages = pagination.total_pages;
                displayBlocks(blocks);
                displayPagination(pagination);
            } catch (error) {
                document.getElementById('blocks-container').innerHTML = '<div class="block-card"><div class="info-label" style="color: #f44336;">❌ ไม่สามารถโหลดบล็อกได้</div><div class="info-value">' + error.message + '</div></div>';
            }
        }
        async function searchBlock() {
            const blockNumber = document.getElementById('search-block').value;
            if (!blockNumber) { alert('กรุณากรอกหมายเลขบล็อก'); return; }
            try {
                const response = await fetch(API_BASE + '/blocks?block_number=' + blockNumber);
                const blocks = await response.json();
                if (blocks.length === 0) {
                    document.getElementById('blocks-container').innerHTML = '<div class="block-card"><div class="info-label" style="color: #f44336;">❌ ไม่พบบล็อก #' + blockNumber + '</div></div>';
                    document.getElementById('pagination').innerHTML = '';
                } else { displayBlocks(blocks); document.getElementById('pagination').innerHTML = ''; }
            } catch (error) { alert('เกิดข้อผิดพลาด: ' + error.message); }
        }
        function displayBlocks(blocks) {
            if (blocks.length === 0) { document.getElementById('blocks-container').innerHTML = '<div class="block-card"><div class="info-label">ไม่พบบล็อก</div></div>'; return; }
            const blocksHTML = blocks.map(block => '<div class="block-card"><div class="block-header"><div class="block-number">Block #' + block.block_number + '</div><div class="block-timestamp">' + formatTimestamp(block.timestamp) + '</div></div><div class="block-hash">Hash: ' + block.hash + '</div><div class="block-info"><div class="info-item"><span class="info-label">Transactions:</span><span class="info-value">' + block.total_tx_count + '</span>' + (block.user_tx_count > 0 ? '<span class="tx-badge user">👤 ' + block.user_tx_count + '</span>' : '') + (block.coinbase_tx_count > 0 ? '<span class="tx-badge coinbase">⛏️ ' + block.coinbase_tx_count + '</span>' : '') + '</div><div class="info-item"><span class="info-label">Nonce:</span><span class="info-value">' + block.nonce + '</span></div></div></div>').join('');
            document.getElementById('blocks-container').innerHTML = blocksHTML;
        }
        function displayPagination(pagination) {
            const html = '<button class="btn btn-secondary" onclick="loadBlocks(' + (pagination.current_page - 1) + ')" ' + (!pagination.has_prev ? 'disabled' : '') + '>← ก่อนหน้า</button><div class="page-info">หน้า ' + pagination.current_page + ' จาก ' + pagination.total_pages + ' (รวม ' + pagination.total_blocks.toLocaleString() + ' บล็อก)</div><button class="btn btn-secondary" onclick="loadBlocks(' + (pagination.current_page + 1) + ')" ' + (!pagination.has_next ? 'disabled' : '') + '>ถัดไป →</button>';
            document.getElementById('pagination').innerHTML = html;
        }
        function formatTimestamp(timestamp) {
            if (!timestamp) return '-';
            const date = new Date(timestamp);
            const day = date.getDate().toString().padStart(2, '0');
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const year = date.getFullYear() + 543;
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');
            const seconds = date.getSeconds().toString().padStart(2, '0');
            return day + '/' + month + '/' + year + ' ' + hours + ':' + minutes + ':' + seconds;
        }
        loadBlocks(1);
    </script>
</body>
</html>
